{{define "content"}}
{{with .Class}}
<div class="class-detail-layout">
<div class="class-outline-column">
<p class="class-outline-back"><a href="/classes">{{T "class_detail.all_classes"}}</a></p>
<nav class="class-outline" aria-label="{{T "class_detail.outline_aria_label"}}">
  <h3>{{T "class_detail.outline_heading"}}</h3>
  <ul id="class-outline-list"></ul>
</nav>
</div>
<div class="class-detail">
{{template "class_detail_card" .}}
</div>
</div>
{{end}}
{{end}}
