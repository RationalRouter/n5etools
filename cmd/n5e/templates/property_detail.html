{{define "content"}}
{{with .Property}}
<p><a href="/properties">← All Properties</a></p>
<h1>{{.Name}}</h1>

<p class="overview">{{.Description}}</p>

{{if .Weapons}}
<h2>{{$.EquipmentLabel}} with this Property</h2>
<ul class="plain-list">
  {{range .Weapons}}
  <li><a href="/items?q={{.Name}}">{{.Name}}</a>{{if .Detail.Valid}} <span class="entry-level">({{.Detail.String}})</span>{{end}}</li>
  {{end}}
</ul>
{{end}}
{{end}}
{{end}}
