{{define "content"}}
<h1>{{T "character_new.title"}}</h1>
{{if .Error}}<p class="creation-form-error">{{.Error}}</p>{{end}}
<form class="creation-form" method="post" action="/characters">
  <label for="name">{{T "character_new.name_label"}}</label>
  <input type="text" id="name" name="name" autofocus required>
  <button type="submit" class="btn-primary">{{T "character_new.start_creating"}}</button>
</form>
{{end}}
