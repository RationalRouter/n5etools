{{define "content"}}
<h1>{{T "properties.title"}}</h1>

<h2>{{T "properties.weapon_properties"}}</h2>
<ul class="tooltip-list">
  {{range .WeaponProperties}}
  <li class="tooltip" tabindex="0">
    <a class="tooltip-trigger" href="/properties/{{.Slug}}">{{.Name}}</a>
    <span class="tooltip-content">{{.Description}}</span>
  </li>
  {{end}}
</ul>

<h2>{{T "properties.armor_properties"}}</h2>
<ul class="tooltip-list">
  {{range .ArmorProperties}}
  <li class="tooltip" tabindex="0">
    <a class="tooltip-trigger" href="/properties/{{.Slug}}">{{.Name}}</a>
    <span class="tooltip-content">{{.Description}}</span>
  </li>
  {{end}}
</ul>
{{end}}
