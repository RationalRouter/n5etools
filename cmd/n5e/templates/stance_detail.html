{{define "content"}}
{{with .Stance}}
<p><a href="/stances">{{T "stance_detail.back_link"}}</a></p>
<h1>{{.Name}}</h1>
<p class="card-epithet">{{T $.TypeLabelKey}}</p>

{{if .Prerequisites.Valid}}
<dl class="fact-list">
  <dt>{{T "stance_detail.prerequisite"}}</dt><dd>{{.Prerequisites.String}}</dd>
</dl>
{{end}}

{{formatDescription .Description}}
{{end}}
{{end}}
